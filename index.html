<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jim+Nightshade&family=Oswald:wght@200..700&family=Outfit:wght@100..900&display=swap");
    </style>
    <title>Your List</title>
  </head>
  <body>
    <div class="container">
      <h1 class="welcome">Your ToDo List</h1>
      <p class="done">Done 1/5</p>
      <div class="input-group">
        <input type="text" placeholder="What are your plans for today?" />
        <button class="add">Add your task</button>
      </div>
      <ul class="task-list">
        <li class="task-item">
          <div class="task-info">
            <input type="checkbox" class="task-checkbox" />
            <div class="bam">
              <span class="task-text">Task #1</span>
            </div>
            <div class="task-actions">
              <button class="edit-btn">EDIT</button>
              <button class="dlt-btn">DELETE</button>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </body>
</html>
